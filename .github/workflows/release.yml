name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Determine Version
        id: version
        shell: bash
        run: |
          RAW_VERSION=$(bun -e "console.log(require('./package.json').version)")
          echo "VERSION=${RAW_VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=v${RAW_VERSION}" >> $GITHUB_OUTPUT

      - name: Compile Windows standalone binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows-x64
          bun build --compile --minify --external ffmpeg-static ./src/index.ts --outfile ./dist/windows-x64/bot-server.exe
          Copy-Item windows/run.bat dist/windows-x64/
          Get-ChildItem -Path node_modules -Filter "davey*.node" -Recurse | Copy-Item -Destination dist/windows-x64/ -Force

      - name: Package Windows release archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/windows-x64/* -DestinationPath dist/discord-music-bot-windows-x64.zip -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Release ${{ steps.version.outputs.TAG }}
          files: |
            dist/discord-music-bot-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
