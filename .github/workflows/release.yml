name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release (Windows x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Fetch Windows native voice binding (davey)
        run: |
          mkdir -p dist/windows-x64
          curl -fsSL https://registry.npmjs.org/@snazzah/davey-win32-x64-msvc/-/davey-win32-x64-msvc-0.1.12.tgz | tar -xz --strip-components=1 -C dist/windows-x64 package/davey.win32-x64-msvc.node
          mkdir -p node_modules/@snazzah/davey
          cp dist/windows-x64/davey.win32-x64-msvc.node node_modules/@snazzah/davey/
          mkdir -p node_modules/@snazzah/davey-win32-x64-msvc
          cp dist/windows-x64/davey.win32-x64-msvc.node node_modules/@snazzah/davey-win32-x64-msvc/

      - name: Determine Version
        id: version
        run: |
          RAW_VERSION=$(bun -e "console.log(require('./package.json').version)")
          echo "VERSION=${RAW_VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=v${RAW_VERSION}" >> $GITHUB_OUTPUT

      - name: Compile Windows standalone binary
        run: |
          bun build --compile --minify --external ffmpeg-static ./src/index.ts --target=bun-windows-x64 --outfile ./dist/windows-x64/bot-server.exe

      - name: Package Windows release archive (with davey native binding & run.bat)
        run: |
          cp windows/run.bat ./dist/windows-x64/
          cd dist
          (cd windows-x64 && zip -r ../discord-music-bot-windows-x64.zip .)
          tar -czf discord-music-bot-windows-x64.tar.gz -C windows-x64 .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Release ${{ steps.version.outputs.TAG }}
          files: |
            dist/discord-music-bot-windows-x64.zip
            dist/discord-music-bot-windows-x64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
